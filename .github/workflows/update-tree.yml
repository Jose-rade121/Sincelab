name: Actualizar árbol del README

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
  workflow_dispatch:        # permite ejecutarlo a mano desde la pestaña Actions
  schedule:
    - cron: "0 6 * * 1"     # opcional: cada lunes a las 06:00 UTC

permissions:
  contents: write

jobs:
  tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerar árbol
        run: python3 .github/scripts/update_tree.py

      - name: Commit si hay cambios
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "docs: actualizar árbol del proyecto"
            git push
          fi
